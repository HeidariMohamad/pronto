server {
    listen 80;
    server_name pronto.yourdomain.com;

    root /var/www/pronto;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Maximum client payload size (for backups & photo uploads)
    client_max_body_size 15M;

    # Proxy API requests to Node.js backend
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Serve uploaded shift photos directly from disk (fast & cached)
    location /uploads/ {
        alias /var/www/pronto-server/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Cache static assets (hashed files) for 1 year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Service Worker - Never Cache! 
    # This is critical for PWA updates to work immediately
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
        expires 0;
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    location / {
        # Redirect all 404s to index.html for React Router
        try_files $uri $uri/ /index.html;
    }
}
